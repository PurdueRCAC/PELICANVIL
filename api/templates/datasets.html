<!doctype html>
<html>
  <head>
    <script>(function(){try{if(localStorage.getItem("pelican-ui-theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}})();</script>
    <title>{{CATEGORY}} | PELICANVIL</title>
    {% if BLIND_MODE %}
    <link rel="icon" type="image/svg+xml" href="{{ROOT_URL}}/api/static/img/blind-mode-favicon.svg">
    {% else %}
    <link rel="icon" type="image/png" href="{{ROOT_URL}}/api/static/img/pelican-ui-logo.png">
    {% endif %}
    <script>window.ROOT_PATH = "{{ROOT_URL}}" </script>
    <script>window.USER = "{{USER}}"</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="{{ROOT_URL}}/api/static/js/toast.js"></script>
    <script src="{{ROOT_URL}}/api/static/js/datasets.js" defer></script>
    <script src="{{ROOT_URL}}/api/static/js/theme.js" defer></script>
    <script>window.CATEGORY = "{{CATEGORY}}"</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/navbar.css?v=2">
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/toast.css">
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/datasets.css">
    {% if BLIND_MODE %}
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/blind-mode.css">
    {% endif %}

  </head>
  <body>
    <div class="page-wrapper">
    {% include "partials/navbar.html" %}
    <div class="download-file-selector-overlay">
    </div>
    <div class="token-auth-modal-overlay">
    </div>
    <div class="dataset-card-container">
      <div class="dataset-toolbar">
        <div class="dataset-search-bar">
          <input type="text" class="dataset-search-input" placeholder="Filter datasets by name or description">
        </div>
        <div class="dataset-filter-bar">
          <div class="dataset-filter-field">
            <label for="dataset-filter-format" class="dataset-filter-label">File type</label>
            <select id="dataset-filter-format" class="dataset-filter-select">
              <option value="">All types</option>
            </select>
          </div>
          <div class="dataset-filter-field">
            <label for="dataset-filter-category" class="dataset-filter-label">Category</label>
            <select id="dataset-filter-category" class="dataset-filter-select">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="dataset-filter-field">
            <label for="dataset-filter-streamable" class="dataset-filter-label">Streaming</label>
            <select id="dataset-filter-streamable" class="dataset-filter-select">
              <option value="">All datasets</option>
              <option value="true">Streamable only</option>
              <option value="false">Download only</option>
            </select>
          </div>
        </div>
      </div>
      <div class="dataset-search-status" style="display:none;">
        <span class="dataset-search-status-text"></span>
        <button class="dataset-search-clear">Clear search</button>
      </div>
      <div class="dataset-search-empty" style="display:none;">
        <span class="dataset-search-empty-text">No datasets match your search or filters.</span>
        <button class="dataset-search-empty-clear" style="display:none;">Clear search</button>
      </div>
      <div class="dataset-category-empty" style="display:none;">This category doesn't have any datasets yet.</div>
    </div>
</div>
  </body>
</html>
