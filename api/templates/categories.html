<!doctype html>
<html>
  <head>
    <script>(function(){try{if(localStorage.getItem("pelican-ui-theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}})();</script>
    <title>Categories | PELICANVIL</title>
    {% if BLIND_MODE %}
    <link rel="icon" type="image/svg+xml" href="{{ROOT_URL}}/api/static/img/blind-mode-favicon.svg">
    {% else %}
    <link rel="icon" type="image/png" href="{{ROOT_URL}}/api/static/img/pelican-ui-logo.png">
    {% endif %}
    <script>window.ROOT_PATH = "{{ROOT_URL}}" </script>
    <script>window.CATEGORY = "{{CATEGORY}}"</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="{{ROOT_URL}}/api/static/js/toast.js"></script>
    <script src="{{ROOT_URL}}/api/static/js/categories.js?v=2"></script>
    <script src="{{ROOT_URL}}/api/static/js/theme.js" defer></script>
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/navbar.css?v=2">
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/toast.css">
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/categories.css">
    {% if BLIND_MODE %}
    <link rel="stylesheet" href="{{ROOT_URL}}/api/static/css/blind-mode.css">
    {% endif %}
  </head>
  <body>
    {% include "partials/navbar.html" %}
    <div class="category-page">
      <div class="category-search-bar">
        <input type="text" class="category-search-input" placeholder="Search all datasets by name or description">
        <button class="category-search-submit">Search</button>
      </div>
      <div class="category-card-container">
      </div>
      <div class="category-empty-state" style="display:none;">
        <i class="fa fa-folder-open-o category-empty-state-icon"></i>
        <p class="category-empty-state-text"></p>
      </div>
    </div>
    {% include "partials/footer.html" %}
  </body>
</html>
